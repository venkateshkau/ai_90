[project]
name = "ai-90"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Venkatesh", email = "vengets@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-90 = "ai_90:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
